[package]
name = "ch-gui"
version = "0.2.31"
description = "ClickHouse desktop GUI"
authors = ["Matias Dominguez"]
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "ch_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }

klickhouse = { version = "0.13", default-features = false, features = ["tls", "compression", "serde"] }

tokio = { version = "1", features = ["full"] }
futures = "0.3"

chrono = { version = "0.4", default-features = false, features = ["std"] }

rustls = "0.23"
tokio-rustls = "0.26"
rustls-pki-types = "1"
rustls-pemfile = "2"
rustls-native-certs = "0.8"
webpki-roots = "0.26"

keyring = { version = "3", features = ["apple-native"] }

uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-updater = { version = "2.10.1", default-features = false, features = ["native-tls"] }
tauri-plugin-process = "2.3.1"
serde_json = "1.0.149"
whoami = "1.6"

[profile.release.build-override]
strip = "none"

# Upstream klickhouse lacks the server log streaming, JSON, named tuple, and other patches
# this app needs. docs/architecture.md lists them.
[patch.crates-io]
klickhouse = { path = "../vendor/klickhouse" }
